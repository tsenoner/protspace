name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/protspace/**'
      - 'apps/prep/**'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality checks
        run: pnpm quality

      - name: Run test suite
        run: pnpm test:ci

      - name: Run build
        run: pnpm build
        env:
          VITE_PREP_API_BASE: https://backend.protspace.app

      - name: Build documentation
        run: pnpm docs:build

      - name: Copy docs to app dist
        run: |
          mkdir -p apps/web/dist/docs
          cp -r docs/.vitepress/dist/* apps/web/dist/docs/

      # The bundles the manifest pins are cached under its hash (after the
      # build, which empties dist/), so a deploy that leaves the manifest alone
      # downloads nothing: the fetch below keeps every file whose bytes it
      # verifies and downloads the rest. No restore-keys, so a file another
      # manifest pinned is never restored into the published directory.
      - name: Restore the fetched example bundles
        uses: actions/cache@v4
        with:
          path: apps/web/dist/examples
          key: example-bundles-${{ hashFiles('apps/web/src/explore/example-manifest.ts') }}

      # The example bundles are not in git: each release-hosted example in
      # apps/web/src/explore/example-manifest.ts, plus the previous release's
      # retained files (kept one cycle so open tabs and published links keep
      # working), is downloaded into dist/examples/ and checked against its
      # manifest byte count and sha256. A missing asset or any mismatch fails
      # the job, so nothing is published.
      - name: Fetch and verify the example bundles
        run: pnpm examples:fetch --out apps/web/dist/examples --with-retained

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'apps/web/dist'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
