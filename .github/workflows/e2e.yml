name: E2E Tests (Playwright)

on:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    # Keep `synchronize`: the state that gets merged is the one worth testing.
    types: [opened, reopened, synchronize]
    # Err broad: a wrong filter does not fail the job, it silently never runs, which reads
    # like a pass (see bundle-contract.yml). Hence `packages/**` and the root files the app
    # resolves through, not just the two packages it imports today.
    # Do not add a label gate alongside this: `paths:` suppresses the webhook, so a label on
    # a PR outside these paths can never start a run. Use `workflow_dispatch` instead.
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'turbo.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  # Cancel superseded PR runs; let the nightly and manual dispatches finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The e2e-validation scenario "a role fixture is derived, not hand-edited": the four
  # example_role_* fixtures must be exactly what the derivation script writes from the pinned
  # fixtures, or the suite would test views no real example has. Fast and independent of
  # Playwright, so it is a job of its own.
  role-fixtures:
    name: Example role fixtures are derived
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      # The script pins its own pyarrow (inline metadata), so uv runs it outside the project.
      - name: The committed role fixtures are what the script derives
        run: uv run apps/web/tests/fixtures/derive-example-role-fixtures.py --check

  # Every default project except the Firefox/WebKit compatibility projects below. No apt:
  # every Chromium system library is already on the ubuntu-24.04 image. `--with-deps chromium
  # firefox webkit` used to pull ~180 packages (125 MB, nearly all WebKit's GStreamer/GTK4
  # stack) from azure.archive.ubuntu.com on every run, and when that mirror stalls the fetch
  # alone took 19 min (run 36728112695) and 31 min (run 34576016462) —
  # actions/runner-images#14594. Playwright checks the host libraries at launch, so a library
  # the image drops fails the first test loudly rather than hanging.
  #
  # Split across parallel shards. The suite is CPU-bound (SwiftShader WebGL), and 2 workers is
  # the most a 4-vCPU runner takes: 3 workers made every test ~35% slower (PR #423). More
  # runners is what scales. Shards split by test count; at two, both carry about the same
  # test time. Add a shard when one runs past ~5 min.
  e2e-chromium:
    name: E2E Tests (Chromium ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # A normal shard is 4-6 min. Without this the default is 360 min.
    timeout-minutes: 20
    strategy:
      # Let every shard finish, so one red run reports all its failures.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Keyed on the browser build, not the lockfile: a lockfile hash would rewrite the cache
      # on every dependency bump. No restore-keys for the same reason — a prefix match
      # restores superseded browser dirs that then get re-saved.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-shell-${{ steps.pw.outputs.version }}

      # Headless tests launch chrome-headless-shell (no `channel` is set anywhere), so the
      # full Chromium build is dead weight. Skips any download the cache restored.
      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: pnpm exec playwright install --only-shell chromium

      # Hosted runners of the same label differ in speed: one SHA ran its test step in 5.4 min
      # on some nights and 8.2 min on others. Log the CPU before blaming a code change.
      - name: Runner hardware
        run: nproc && lscpu | grep 'Model name'

      # Only the packages the dev server resolves through node_modules. The tests are served
      # by `pnpm dev:app` (a Vite dev server, see webServer in playwright.config.ts), so
      # `@protspace/app#build` produced an 89MB bundle nothing here reads.
      - name: Build workspace packages
        run: pnpm build --filter=@protspace/core --filter=@protspace/utils

      - name: Run Playwright tests
        run: pnpm test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          E2E_BROWSERS: chromium

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium-${{ matrix.shard }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
          if-no-files-found: ignore

  # The Firefox/WebKit projects, which run only the @cross-browser/@opfs-browser compatibility
  # journeys. They run in the official image, which ships Firefox, WebKit and their system
  # libraries, so this job does no apt at all. The tag must match @playwright/test in
  # pnpm-lock.yaml exactly: bump both together; the version check below fails fast if they
  # drift.
  e2e-cross-browser:
    name: E2E Tests (Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      # The runner's uid, which owns the mounted workspace and HOME (Playwright CI docs).
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The image ships Node 24; stay on the version the rest of CI and .nvmrc use.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      # Separate key from the host job: the store path differs inside the container.
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-container-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-container-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Playwright matches the image
        run: |
          installed=$(pnpm exec playwright --version | awk '{print $2}')
          if [ "$installed" != "1.61.0" ]; then
            echo "::error::@playwright/test is $installed but the container image is v1.61.0; bump the image tag in e2e.yml"
            exit 1
          fi

      - name: Build workspace packages
        run: pnpm build --filter=@protspace/core --filter=@protspace/utils

      - name: Run Playwright tests
        run: pnpm test:e2e
        env:
          E2E_BROWSERS: firefox,webkit

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cross-browser
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
          if-no-files-found: ignore
