name: Example bundles

# A pull request that changes which bundle files the app or the perf harness pins
# proves the pinned files exist and match, before the deploy (or a benchmark run)
# would find out. The deploy runs the same `pnpm examples:fetch`; here it
# downloads into a scratch directory, and the manifest writer then re-reads every
# file to check that the committed columns, projections and protein counts are
# the files'. `pnpm perf:fetch` does the same for the perf-datasets release.
#
# The fetched files are cached under the hash of the manifest that pins them and
# of the fetch script, so a run that changes neither downloads nothing (the
# fetch still verifies every cached file), while a new manifest or fetcher is
# checked against the release itself.
on:
  pull_request:
    # Err broad: a path filter that misses does not fail, it silently never runs.
    paths:
      - 'apps/web/src/explore/example-manifest.ts'
      - 'apps/protspace/scripts/generate_examples/write_manifest.py'
      - 'apps/web/src/explore/example-served-path.ts'
      - 'perf/datasets.manifest.json'
      - 'perf/datasets-manifest.ts'
      - 'scripts/examples/**'
      - 'package.json'
      - '.github/workflows/example-bundles.yml'
  workflow_dispatch:

concurrency:
  group: example-bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Example bundles match the manifest
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the fetched example bundles
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/examples
          key: example-bundles-check-${{ hashFiles('apps/web/src/explore/example-manifest.ts', 'scripts/examples/**') }}

      - name: Fetch and verify every pinned example bundle
        run: pnpm examples:fetch --out "$RUNNER_TEMP/examples" --with-retained

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: The manifest is what the files hold
        run: >-
          uv run --no-project --with pyarrow python
          apps/protspace/scripts/generate_examples/write_manifest.py
          --refresh --check --examples-dir "$RUNNER_TEMP/examples"

  perf-datasets:
    name: Perf datasets match their checksum list
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the fetched perf datasets
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/perf-datasets
          key: perf-datasets-check-${{ hashFiles('perf/datasets.manifest.json', 'perf/datasets-manifest.ts', 'scripts/examples/**') }}

      - name: Fetch and verify every perf dataset
        run: pnpm perf:fetch --out "$RUNNER_TEMP/perf-datasets"
