name: protspace Release

# Single version authority for the protspace PyPI package (apps/protspace).
# Runs semantic-release from apps/protspace on Python-only changes to main, then
# dispatches protspace-publish. NEEDS a live Actions dry-run before trusting it
# (OpenSpec task 3.4) and these repo secrets: RELEASE_APP_ID, RELEASE_APP_PRIVATE_KEY.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/protspace/**'
      - '.github/workflows/protspace-release.yml'

defaults:
  run:
    working-directory: apps/protspace

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      id-token: write
      contents: write
    outputs:
      released: ${{ steps.semantic_release.outputs.released }}
      tag: ${{ steps.semantic_release.outputs.tag }}
    env:
      UV_TOOL_DIR: /tmp/.uv-tools

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          # Required: semantic-release walks history to compute the bump. A
          # shallow clone makes it miscount commits rather than fail loudly.
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Force correct release branch
        run: |
          git checkout -B ${{ github.ref_name }} ${{ github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Pin semantic-release's interpreter rather than floating to the newest
          # runner Python (actions/setup-python resolved requires-python ">=3.12"
          # to the newest available). Sets UV_PYTHON for the uv tool commands below.
          python-version: '3.12'

      - name: Restore uv tools
        uses: actions/cache@v5
        with:
          path: /tmp/.uv-tools
          key: uv-tools-${{ runner.os }}-psr-v10.6.1
          restore-keys: |
            uv-tools-${{ runner.os }}

      - name: Install Python Semantic Release
        run: uv tool install python-semantic-release@v10.6.1

      - name: Run Semantic Release
        id: semantic_release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e
          echo "Running semantic release..."

          # Run semantic release with error handling.
          #
          # `released` MUST be decided from the output, not the exit code:
          # semantic-release exits 0 when it declines to cut a release ("No
          # release will be made, X has already been released!"). Every release
          # pushes a version-bump commit that touches apps/protspace/**, which
          # re-triggers this workflow; that second run is exactly the exit-0
          # no-op case. Keying off the exit code alone reported released=true
          # there and dispatched a duplicate publish of the tag that had just
          # been published (v4.9.1 was uploaded to PyPI twice on 2026-07-24).
          if output=$(uv tool run --from python-semantic-release semantic-release version --commit --changelog --push --tag --vcs-release 2>&1); then
            echo "$output"

            latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            echo "tag=$latest_tag" >> $GITHUB_OUTPUT

            if echo "$output" | grep -q "No release will be made\|no new version"; then
              echo "No release needed - skipping publish"
              echo "released=false" >> $GITHUB_OUTPUT
            else
              echo "released=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "Semantic release failed:"
            echo "$output"

            # Same no-op check on the non-zero path: older versions signalled
            # "nothing to release" with a failing exit code.
            if echo "$output" | grep -q "No release will be made\|no new version"; then
              echo "No release needed"
              echo "released=false" >> $GITHUB_OUTPUT
              latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
              echo "tag=$latest_tag" >> $GITHUB_OUTPUT
            else
              echo "Genuine semantic release error - failing the job"
              exit 1
            fi
          fi

  trigger-publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Trigger Publish
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          event-type: trigger-publish
          client-payload: '{"tag": "${{ needs.release.outputs.tag }}"}'
