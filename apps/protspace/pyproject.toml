[project]
name = "protspace"
version = "4.9.1"
description = "Prepare protein language model (pLM) embeddings for interactive exploration at protspace.app — embed, project, annotate, transfer labels (EAT), and bundle."
authors = [{ name = "Tobias Senoner", email = "tobias.senoner@tum.de" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "h5py>=3.12.1",
    "scikit-learn>=1.6.1",
    "umap-learn>=0.5.10",
    "pacmap>=0.8.0",
    "numpy>=1.23.0",
    "pandas>=2.0.0",
    "tqdm>=4.67.1",
    "pyarrow>=20.0.0",
    "biocentral-api>=1.2.1",
    "requests>=2.32.4",
    "typer>=0.24.1",
    "rich>=13.8.0",
    "protlabel>=4.4.0",
]

[project.urls]
Homepage = "https://protspace.app"
Repository = "https://github.com/tsenoner/protspace"
Documentation = "https://protspace.app/docs/"
Issues = "https://github.com/tsenoner/protspace/issues"
Changelog = "https://github.com/tsenoner/protspace/blob/main/apps/protspace/CHANGELOG.md"

[project.optional-dependencies]
frontend = [
    "dash>=3",
    "dash-bootstrap-components>=1.6.0",
    "dash-daq>=0.5.0",
    "dash-iconify>=0.1.2",
    "plotly>=5.24.1",
    "kaleido>=0.2.1,!=0.2.1.post1",
    "dash-molstar>=1.3.0",
]
local = [
    "einops>=0.8.2",
    # Floor only, deliberately low: needed by transformers' slow-tokenizer
    # conversion (ProtT5/Ankh T5Tokenizer). A tighter pin conflicted with
    # Colab's preinstalled protobuf.
    "protobuf>=3.20",
    "sentencepiece>=0.2.2",
    "torch>=2.4",
    "transformers>=5.13.1",
]
similarity = [
    "pymmseqs>=1.0.4",
]

[project.scripts]
protspace = "protspace.cli.app:app"





[dependency-groups]
dev = [
    "dash[testing]>=3",
    "webdriver-manager>=4.0.1",
    "biopython>=1.84",
    "cairosvg>=2.7.1",
    "dash-mantine-components>=0.14.5",
    "holoviews>=1.19.1",
    "hvplot>=0.11.0",
    "ijson>=3.3.0",
    "jupyter>=1.1.1",
    "jupyter-black>=0.4.0",
    "jupyter-bokeh>=4.0.5",
    "panel>=1.5.2",
    "ruff>=0.6.9",
    "xarray>=2024.9.0",
    "torch>=2.2,<3.0",
    "seaborn>=0.13.2",
    "pytest>=8.3.3",
    "polars>=1.26.0",
    "jupytext>=1.17.1",
    "pytest-cov>=7.0.0",
]

# protlabel (the EAT engine) is a separate distribution developed in-repo. It is a
# member of the monorepo root uv workspace (see the root pyproject.toml) — apps/protspace
# cannot declare its own [tool.uv.workspace] because nested workspaces are not allowed.
# During development protlabel resolves locally; the published protspace wheel depends
# on it from PyPI.

[tool.uv.sources]
protlabel = { workspace = true }


[tool.hatch.build.targets.wheel]
packages = ["src/protspace"]


[tool.pytest.ini_options]
# Collect both the protspace tests and the protlabel workspace member's tests
# so a bare `uv run pytest` runs the whole workspace.
testpaths = ["tests", "packages/protlabel/tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that require external services",
]
filterwarnings = [
    "ignore::DeprecationWarning:parmed.*:",
    "ignore::DeprecationWarning:selenium.*:",
    "ignore::DeprecationWarning:kaleido.*:",
    "ignore::DeprecationWarning:dash_molstar.*:",
    "ignore::RuntimeWarning:sklearn.utils.extmath:",
    "ignore:n_jobs value:UserWarning:umap:",
]


[tool.ruff]
# Explicit target matching requires-python (AGENTS.md convention). Load-bearing,
# not just documentation: the nested protlabel member has no own [tool.ruff], so
# ruff lints packages/ against this ancestor config.
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG001", # unused-function-args
    "F401", # unused-import
    "F841", # unused-variable
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "C901", # too complex
]

[tool.ruff.lint.isort]
# protlabel lives in the packages/protlabel workspace member (not src/), so
# declare both packages first-party for stable import grouping.
known-first-party = ["protspace", "protlabel"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "F401", "F841", "F811"]  # Pytest fixtures intentionally redefine module-level fixtures
"packages/*/tests/*" = ["ARG001", "F401", "F841", "F811"]  # same, for workspace-member tests
"examples/notebook/*" = ["E402", "F811", "ARG001", "F841"]  # Jupyter notebooks: imports after config, cell re-imports, widget callback args

# Runs from apps/protspace (see .github/workflows/protspace-release.yml), so the
# version paths stay relative to this file. build_command mirrors the bumped version
# into uv.lock via sync_lock_version.py (see its docstring for why a surgical edit
# rather than `uv lock`) and stages it with `git add` so the release commit keeps
# `uv sync --locked` green. assets stays [] because the lock is staged, not an asset;
# no wheel build here (publishing is handled by protspace-publish.yml). protspace +
# protlabel stay lock-step (same bump).
[tool.semantic_release]
# Monorepo scoping (requires python-semantic-release >= 10, pinned in
# protspace-release.yml): count ONLY commits that touch this package dir
# (apps/protspace) so unrelated web/frontend feat/fix commits don't inflate
# protspace's version or changelog. tag_format stays the repo-wide default
# `v{version}` (protspace is the primary package; protlabel ships lock-step).
commit_parser = "conventional-monorepo"
assets = []
build_command = "python3 scripts/sync_lock_version.py && git add ../../uv.lock"
version_toml = [
    "pyproject.toml:project.version",
    "packages/protlabel/pyproject.toml:project.version",
]
version_variables = ["src/protspace/__init__.py:__version__"]

[tool.semantic_release.commit_parser_options]
path_filters = ["."]

[tool.semantic_release.changelog]
# Keep the v9 full-regenerate behavior; the existing CHANGELOG has no v10
# update-mode insertion marker.
mode = "init"



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

