# ---------------------------------------------------------------------------
# swissprot: Fig. 2A, marked Large. Paper membership (573,649) and the UMAP
# coordinates only (D2). Ships only if it loads in ≤ ~35 s with ≤ ~1.5 GB of heap,
# measured in a browser and recorded with `record-load` (tied to the file's sha256);
# otherwise rebuild with --web-cut (drops GO and TED; the full file goes to Zenodo;
# the decision is kept for later builds) and measure the cut file.
# ---------------------------------------------------------------------------
[datasets.swissprot]
kind = "paper-refresh"
name = "Swiss-Prot"
hosting = "release"
large = true
proteins = 573649
figure = "Fig. 2A"
membership = "UniProtKB/Swiss-Prot entries with a UniProt ProtT5 vector (UniProt omits sequences over 12,000 aa)"
membership_release = "2025_04 (inferred; confirm with the author, tasks 7.1)"
embeddings = ["{cli_data}/other/sprot/per-protein.h5:prot_t5"]
projections_source = "{nm_data}/swissprot_573k_stats"
pins = [
  { path = "{nm_data}/swissprot_573k_stats/projections_metadata.parquet", sha256 = "67ded19506da5065b0ca8f039fd9fe5727a74f69823ea84fd7e30851a0c3d57f" },
  { path = "{nm_data}/swissprot_573k_stats/projections_data.parquet", sha256 = "969dcb46d921c5b3c79e77b836bdec63dbe04b3be78342ab5aa64cbd64603582" },
  { path = "{cli_data}/other/sprot/per-protein.h5", bytes = 1425064360 },
]
projections = ["UMAP_2=ProtT5 — UMAP 2"]
stages = [
  { groups = ["domain", "uniprot", "taxonomy"] },   # about 1 h
  { groups = ["interpro"] },                        # about 5 h (2-20 h)
  { groups = ["ted"] },                             # 18-40 h: the critical path, run it alone
  { groups = ["biocentral"], enabled = false, name = "biocentral" },  # needs the Rostlab operators' OK: --enable-stage biocentral
]
stats = true
stats_annotations = ["domain", "kingdom", "protein_existence", "signal_peptide", "reviewed", "protein_families"]
web_cut = ["go_bp", "go_cc", "go_mf", "ted_domains"]
styles = "styles/swissprot.json"
reviewed = "Swiss-Prot"
max_obsolete = 100   # G17: about 45 expected

[datasets.swissprot.default_view]
projection = "ProtT5 — UMAP 2"
annotation = "domain"
tooltip = ["protein_families", "species"]

[datasets.swissprot.report]
annotations = ["domain", "kingdom", "protein_families", "pfam_clan", "cluster_elbow_ProtT5 — UMAP 2"]
projections = ["ProtT5 — UMAP 2"]

[[datasets.swissprot.gates]]
type = "category_counts"   # Fig. 2A, within ±1 %
column = "domain"
rel_tol = 0.01
abs_tol = 5

[datasets.swissprot.gates.expected]
Bacteria = 336823
Eukaryota = 199528
Archaea = 19814
Riboviria = 6881
Varidnaviria = 4297
Duplodnaviria = 4018
Monodnaviria = 1293
Adnaviria = 254
Ribozyviria = 35

[[datasets.swissprot.gates]]
type = "pfam_duplicates"   # was 70.3 % vs 5.5 % before the InterPro fan-out fix
warn_gap = 0.05
max_gap = 0.15

[[datasets.swissprot.gates]]
type = "browser_load"      # D2, measured by hand: build_showcase.py record-load
max_seconds = 35
max_heap_mb = 1536
