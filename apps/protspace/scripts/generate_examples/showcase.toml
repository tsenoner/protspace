# Showcase example datasets for the protspace.app Import menu: the demo first,
# then ascending protein count (D1). Every example ships its UMAP and a PCA (D3).
#
# Read by build_showcase.py in this directory; README.md has usage per dataset.
# OpenSpec change: openspec/changes/curated-example-datasets (design Decisions 1 and
# 9-13, tasks §6-§7).
#
# A column the legend could only show as N/A or as one value fails the
# `informative-columns` gate unless the recipe keeps it in `keep_uninformative`
# (a documented column whose one value is itself the fact, e.g. "all Swiss-Prot")
# or it is the default view's annotation or a tooltip name (W10, G13).
#
# Path templates: {repo} is the checkout this file lives in, {home} is $HOME, and
# every name under [paths] can be used too. Override a path with
# `--path NAME=VALUE` (or PROTSPACE_SUITE for {suite}). Every input is READ-ONLY:
# the build writes only under the output root.
#
# The view each example opens on is the web catalog's `defaultView`
# (apps/web/src/explore/example-datasets.ts, `[build] catalog`), its one source:
# the build orders the columns by it and the gates check it. Pick it from
# `report/report.md` and the thumbnails (G2, tasks 7.5).

[build]
uniprot_release = "2026_03"       # annotations are refreshed at this release; the build stops if UniProt serves another
release_tag = "showcase-2026_03"  # GitHub release hosting every example but the demo (D8)
# Every file is written as parquetbundle v3. The v2 files published under
# {id}_{release}.parquetbundle stay as they are (a release file name never carries
# other bytes), so the v3 files take new names in the same release.
file_pattern = "{id}_{release}_v3.parquetbundle"
checksums_file = "SHA256SUMS_v3"  # the release's SHA256SUMS lists the v2 files; stage-release adds this one
out_root = "{suite}/protspace-showcase/2026_03"
catalog = "{repo}/apps/web/src/explore/example-datasets.ts"
github_repo = "tsenoner/protspace"
zenodo_doi = ""                   # the paper-companion deposit's DOI, if known before the build (else write_manifest.py --zenodo-doi, tasks 8.3)
incomplete_retries = 1            # extra runs of a fetch step whose sources the CLI did not fully retrieve
incomplete_retry_wait_s = 300     # wait before the first extra run (doubled for the second, …)

[paths]
suite = "{home}/Documents/projects/protspace-suite"
nm_data = "{suite}/protspace_publication/nm_2026/data"
cli_data = "{suite}/protspace/apps/protspace/data"

[report]
k = 15                # layout neighbours for the kNN label agreement
max_queries = 20000   # query points sampled per candidate view
legend_top = 10       # the legend view: top labels + Other

# ---------------------------------------------------------------------------
# demo: the startup dataset (D3). ToxProt venom proteins, embedded as mature
# peptides; the four projections are kept, so the docs captures stay valid.
# ---------------------------------------------------------------------------
[datasets.demo]
kind = "demo-refresh"
name = "Venom toxins (demo)"
hosting = "repo"
repo_file = "data.parquetbundle"
proteins = 7831
membership = "ToxProt: (taxonomy_id:33208) AND (cc_tissue_specificity:venom OR cc_scl_term:SL-0177) AND (reviewed:true)"
membership_release = "2026_01"  # from the data: every entry created in 2026_01, none from 2026_02; pre-2026_02 sequences
paper_release = "2026_01"       # the mature-peptide length column, from the same 2026-05-01 build
source = [
  "{repo}/apps/web/tests/fixtures/demo_toxprot_7831.parquetbundle",
  "{repo}/apps/web/public/data.parquetbundle",
]
source_sha256 = "dcebba0f1ca15b49a44ebacd2a0807b2e7b528d51efb84de7a8c8a6ba27770fb"
projections = ["ProtT5 — UMAP 2", "ProtT5 — PCA 2", "ESM2-650M — UMAP 2", "ESM2-650M — PCA 2"]
refresh_groups = ["all"]                  # InterPro and Biocentral see full-length sequences (G8)
keep_source_columns = ["length"]          # the embedded mature-peptide length
fasta = { fallback_tsv = "{cli_data}/toxins/tmp/toxprot.tsv" }
source_legends = ["protein_families"]     # the hand-curated top 13 + Other
styles = "styles/demo.json"
stats = false                             # two embeddings without a metadata `source` column; keep the startup file small
reviewed = "Swiss-Prot"
max_obsolete = 50
keep_uninformative = ["reviewed", "domain", "kingdom", "root"]  # ToxProt is Swiss-Prot animals: one value each, documented columns

[datasets.demo.report]
annotations = ["protein_families", "ec", "pfam", "order", "family", "predicted_subcellular_location"]
projections = ["ProtT5 — UMAP 2", "ESM2-650M — UMAP 2"]

[[datasets.demo.gates]]
type = "coverage"            # was 26.9 % when InterPro saw mature peptides
column = "pfam"
min_fraction = 0.5

[[datasets.demo.gates]]
type = "full_length_inputs"
min_fraction = 0.99

[[datasets.demo.gates]]
type = "source_column_kept"
column = "length"

# ---------------------------------------------------------------------------
# three-finger-toxins: the EAT example (D1). Snake three-finger toxins at
# 2026_03: Swiss-Prot curators name each one's class in `cc_similarity`, the
# TrEMBL entries (mostly venom-gland transcripts) carry none. Every entry is
# embedded as its mature chain, cut by one rule for references and queries (G1:
# Swiss-Prot often holds the mature chain, TrEMBL the precursor; see [mature]);
# InterPro, TED and Biocentral read the full-length sequences (G8).
# A stratified 20 % of the Swiss-Prot entries is held out; toxin_class and
# toxin_subfamily are transferred to the held-out and the TrEMBL rows (k = 1,
# Euclidean). Opens at reliability 0; the docs say "drag to 0.5".
# ---------------------------------------------------------------------------
[datasets.three-finger-toxins]
kind = "embed-build"
name = "Snake three-finger toxins · EAT"
hosting = "release"
proteins = 1089
membership = '(xref:interpro-IPR003571 OR family:"three-finger toxin family") AND (taxonomy_id:8570)'  # the family clause adds 47 reviewed entries InterPro misses (G7)
membership_release = "2026_03"
membership_file = "inputs/three-finger-toxins.accessions.txt"  # the pinned list, relative to this file
membership_sha256 = "2cc644f18375f522e922103bc450371dc5ec35067b72359c8fd24018938716db"
# ProtT5-XL-U50 per protein, as UniProt computes it: the half-precision encoder
# Rostlab/prot_t5_xl_half_uniref50-enc. `local` runs that fixed checkpoint in
# this build (fp32 on CPU, fp16 on CUDA) instead of a remote service, so a
# rebuild does not depend on what Biocentral serves. The pins are the first
# build's output; `input` may name a copy of that file (the Zenodo one), which a
# rebuild then uses instead of embedding again.
embed = { model = "prot_t5", backend = "local", vectors_sha256 = "04a3e237bd4dff65ffd2779ff808704b90886f7adcd387bb60a63af80eaf43a2", sha256 = "974854d873c18b5efde52f72be3ab5c606575734dfae584bb2471df0b282605b" }
methods = "umap2,pca2"   # the PCA survives a projection switch with its EAT rings (docs eat.md)
projection_params = { n_neighbors = 25, min_dist = 0.1, random_state = 42 }
projections = ["ProtT5 — UMAP 2", "ProtT5 — PCA 2"]
# Only columns with something to show: the snakes share their ranks above
# family, and InterPro's superfamily, CATH, CDD, PRINTS, SMART and Pfam clan and
# TMbed's transmembrane type have one value (or none) here; the
# informative-columns gate lists any that does.
stages = [
  { groups = ["protein_families", "reviewed", "length", "fragment", "protein_existence", "annotation_score", "keyword", "xref_pdb", "go_bp", "go_mf", "family", "genus", "species"] },
  { groups = ["pfam", "signal_peptide", "panther", "prosite"] },   # InterPro, Phobius
  { groups = ["ted"] },
  { groups = ["predicted_subcellular_location", "predicted_membrane", "predicted_signal_peptide"] },   # Biocentral: about 1,100 short sequences, minutes
]
first_columns = ["toxin_subfamily", "eat_split", "toxin_class_withheld", "toxin_subfamily_withheld", "toxin_class_uniprot_rule", "species", "genus", "family"]
stats = true
stats_annotations = ["toxin_class", "toxin_subfamily", "family", "genus", "pfam"]
envelope = { eatOverlayEnabled = true, eatConfidenceThreshold = 0.0 }
styles = "styles/three-finger-toxins.json"
reviewed = "mixed"
max_obsolete = 0
# toxin_class_uniprot_rule: one rule (Boigatoxin) labels TrEMBL here, shown as
# the rule's claim. protein_families: "three-finger toxin family" on every row by
# the query, kept so the family-parser gate checks the CLI's parser here too
# (toxin_subfamily and toxin_class hold the levels below it).
keep_uninformative = ["toxin_class_uniprot_rule", "protein_families"]

# How each entry's mature chain is found (build_showcase.py `mature_chains`):
# UniProt's Chain (or Peptide) feature, else the sequence without its Signal and
# Propeptide features. Two gaps in UniProt's features are closed here, so that
# references and queries are cut alike (the mature-inputs gate checks both):
# - 16 TrEMBL entries at 2026_03 have no feature at all, though 15 of them are
#   predicted to carry a signal peptide: 5 precursors, 7 fragments starting inside
#   the signal peptide, 2 gene models and a colubrid precursor. They are cut after
#   the signal peptide's conserved end (elapid ...G[YSHN]T before a mature chain
#   whose first cysteine is residue 3; colubrid ...CLGSA before the propeptide).
#   The other 11 carry no signal evidence and are used as deposited.
# - The Chain SignalP gives a TrEMBL precursor keeps a propeptide. Nine reviewed
#   colubrid toxins (Boiga, Spilotes, Telescopus, Trimorphodon) have a curated
#   15-residue N-terminal propeptide (DQLGLGRQQIDWGQG and kin), and their mature
#   chains are embedded without it, as are the colubrid entries sequenced as
#   protein (C0HJD3, P0C603, P83490). An unreviewed chain starting with one of
#   those propeptides (≤ 5 of 15 residues differ) loses it too: 71 queries
#   otherwise formed an island of their own, 3 of them at RI ≥ 0.5.
[datasets.three-finger-toxins.mature]
signal_motif = "G[YSHN]T(?=[A-Z]{2}C)|CLGSA(?=[DN][QE])"
motif_window = 40
propeptide_max_mismatches = 5

[datasets.three-finger-toxins.labels]
family = "three-finger toxin family"   # the cc_similarity statement the labels are read from
keep_rule_labels = ["toxin_class"]     # TrEMBL's automatic "Boigatoxin" rule labels, kept aside as toxin_class_uniprot_rule

[[datasets.three-finger-toxins.labels.columns]]
name = "toxin_class"   # research2/e2/pilot_tftx.py `cls`: first matching rule wins
rules = [
  ["type i alpha", "Type I α-neurotoxin (short)"],
  ["type ii alpha", "Type II α-neurotoxin (long)"],
  ["type iii alpha", "Type III α-neurotoxin"],
  ["kappa", "κ-neurotoxin"],
  ["cytotoxin", "Cytotoxin"],
  ["aminergic", "Aminergic / muscarinic"],
  ["muscarinic", "Aminergic / muscarinic"],
  ["mambalgin", "Aminergic / muscarinic"],
  ["ancestral", "Ancestral / non-conventional"],
  ["short-chain", "Other short-chain"],
]

[[datasets.three-finger-toxins.labels.columns]]
name = "toxin_subfamily"
rules = [
  ["short-chain subfamily", "Short-chain"],
  ["long-chain subfamily", "Long-chain"],
  ["ancestral subfamily", "Ancestral"],
]

[datasets.three-finger-toxins.holdout]
split_column = "eat_split"   # reference | holdout | trembl
stratify = "toxin_class"     # classes and ids are visited sorted (G4)
fraction = 0.2
seed = 7
columns = ["toxin_class", "toxin_subfamily"]   # blanked on hold-out rows; the truth goes to <column>_withheld

[datasets.three-finger-toxins.transfer]
columns = ["toxin_class", "toxin_subfamily"]
k = 1
metric = "euclidean"   # the RI scale the paper uses (W26); cosine puts every query near 1
query_where = ["eat_split~holdout", "eat_split~trembl"]
reference_where = ["eat_split~reference"]

[datasets.three-finger-toxins.report]
annotations = ["toxin_class", "toxin_subfamily", "eat_split", "genus", "family", "pfam"]
projections = ["ProtT5 — UMAP 2", "ProtT5 — PCA 2"]

[[datasets.three-finger-toxins.gates]]
type = "category_counts"
column = "eat_split"
expected = { reference = 430, holdout = 107, trembl = 552 }

[[datasets.three-finger-toxins.gates]]
type = "holdout_split"   # which 107 rows are held out, not only how many (NumPy may change its stream)
split_column = "eat_split"
value = "holdout"
split_sha256 = "2abb5245a61ab35aaf2562823240c06ee859d3b442300fcff5859079e0b60468"

[[datasets.three-finger-toxins.gates]]
type = "no_refill"
split_column = "eat_split"
query_value = ["holdout", "trembl"]
columns = ["toxin_class", "toxin_subfamily"]

[[datasets.three-finger-toxins.gates]]
type = "eat_accuracy"   # tolerances, not the pilot's numbers (G4): a 200-seed sweep gave min 0.887
column = "toxin_class"
truth_column = "toxin_class_withheld"
split_column = "eat_split"
query_value = "holdout"
threshold = 0.5
min_n = 100
min_accuracy = 88.0
min_accuracy_at_threshold = 90.0

[[datasets.three-finger-toxins.gates]]
type = "eat_accuracy"
column = "toxin_subfamily"
truth_column = "toxin_subfamily_withheld"
split_column = "eat_split"
query_value = "holdout"
threshold = 0.5
min_n = 100
min_accuracy = 95.0

[[datasets.three-finger-toxins.gates]]
type = "eat_transfers"   # the rings at RI ≥ 0.5 on the TrEMBL rows; ± 5 % of the built value
column = "toxin_class"
split_column = "eat_split"
query_value = "trembl"
threshold = 0.5
expected_predicted = 552   # exact: every TrEMBL row gets a transfer
# The 2026_03 build. 238 before the colubrid queries lost their propeptide
# (65 of those 71 now reach 0.5, 3 did); the full-length pilot had 421.
expected_at_threshold = 312
rel_tol = 0.05   # for expected_at_threshold only

[[datasets.three-finger-toxins.gates]]
type = "eat_fanout"   # the pilot's largest donor gave its class to 36 queries
column = "toxin_class"
max_fanout = 40

[[datasets.three-finger-toxins.gates]]
type = "name_agreement"   # research2/e2/tftx_detail.py `hint`: the pilot agreed on 48 of 53
names_from = "entries"      # UniProt's "Protein names": the bundle has no TrEMBL submission names
column = "toxin_class"
split_column = "eat_split"
query_value = "trembl"
min_fraction = 0.85
min_n = 20
rules = [
  ["weak neurotoxin|weak toxin|non-conventional|boigatoxin|denmotoxin", "Ancestral / non-conventional"],
  ["muscarinic", "Aminergic / muscarinic"],
  ["cytotoxin|cardiotoxin", "Cytotoxin"],
  ["short neurotoxin|short-chain neurotoxin", "Type I α-neurotoxin (short)"],
  ["long neurotoxin|long-chain|alpha-elapitoxin|alpha-bungarotoxin", "Type II α-neurotoxin (long)"],
]

[[datasets.three-finger-toxins.gates]]
type = "mature_inputs"   # G1 and G7: every row embedded as its mature chain
family_only_xref = "IPR003571"
expected_family_only = 47

[[datasets.three-finger-toxins.gates]]
type = "full_length_inputs"   # G8: InterPro and Biocentral read full-length sequences
min_fraction = 0.99

# ---------------------------------------------------------------------------
# human-fly: Fig. 2B. Paper membership (105,562) and coordinates; the 146 rows
# without a UniProt vector keep their paper position and are annotated from FASTA.
# ---------------------------------------------------------------------------
[datasets.human-fly]
kind = "paper-refresh"
name = "Human + fly proteomes"
hosting = "release"
proteins = 105562
figure = "Fig. 2B"
membership = "Reference proteomes UP000005640 (human) and UP000000803 (fly)"
membership_release = "2025_04"  # from the data: every entry created in 2025_04, none from 2026_01; built 2026-01-26
embeddings = [
  "{cli_data}/other/homsap_dromel/homsap_UP000005640.h5:prot_t5",
  "{cli_data}/other/homsap_dromel/dromel_UP000000803.h5:prot_t5",
]
projections_source = "{nm_data}/joint_proteome_105k_stats"
pins = [
  { path = "{nm_data}/joint_proteome_105k_stats/projections_metadata.parquet", sha256 = "ad013e9c6fe7b0f9971a327409e59425b3032458dad8b768e9c56a3a497bb5f6" },
  { path = "{nm_data}/joint_proteome_105k_stats/projections_data.parquet", sha256 = "9de7a914aeb5b3bc0228e60fb1edc14c781a888e7ab794e48aa964ce149df692" },
  { path = "{cli_data}/other/homsap_dromel/homsap_UP000005640.h5", bytes = 202839568 },
  { path = "{cli_data}/other/homsap_dromel/dromel_UP000000803.h5", bytes = 53485072 },
]
projections = ["UMAP_2=ProtT5 — UMAP 2", "PCA_2=ProtT5 — PCA 2"]
missing_rows = "annotate"
# Rows whose UniProt entry is gone (74 at 2026_03) take the paper's species and
# that species' refreshed lineage instead of literal "None" strings (W18).
fill_missing_taxonomy = true
stages = [
  { groups = ["species", "protein_families", "uniprot", "taxonomy"] },
  { groups = ["interpro"] },   # 1-1.7 h
  { groups = ["ted"] },        # 3.3-12 h; do not overlap another TED build (429s)
  # Skipped (D4, W11): LightAttention and TMbed read the per-residue ProtT5
  # matrix, which UniProt's mean-pooled vectors cannot give back, so Biocentral
  # would embed all 103,947 sequences itself (10-25 h on the public server).
  # The cards say so. --enable-stage biocentral after an operator batch run.
  { groups = ["biocentral"], enabled = false, name = "biocentral" },
]
stats = true
stats_annotations = ["species", "protein_families", "reviewed", "protein_existence"]
styles = "styles/human-fly.json"
reviewed = "mixed"
max_obsolete = 400   # G17: about 195 expected
keep_uninformative = ["domain", "kingdom", "root"]  # two animal proteomes: one value each, documented columns

[datasets.human-fly.report]
annotations = ["species", "protein_families", "reviewed", "protein_existence"]
projections = ["ProtT5 — UMAP 2", "ProtT5 — PCA 2"]

[[datasets.human-fly.gates]]
type = "category_counts"
column = "species"
expected = { "Homo sapiens" = 83598, "Drosophila melanogaster" = 21964 }
rel_tol = 0.005

[[datasets.human-fly.gates]]
type = "coverage"   # W18: the default view shows no N/A species
column = "species"
min_fraction = 1.0

[[datasets.human-fly.gates]]
type = "label_split"   # conserved: kinases sit in the shared region
column = "protein_families"
by = "species"
label = "protein kinase superfamily"
# 2026_03. The paper counted 1,703: 278 of the 302 rows gained had no family in
# the paper bundle and now carry UniProt's automatic (|SAM) annotation (G11).
expected_total = 2001
rel_tol = 0.15
min_per_group = { "Homo sapiens" = 100, "Drosophila melanogaster" = 100 }

[[datasets.human-fly.gates]]
type = "label_exclusive"
column = "protein_families"
by = "species"
group = "Homo sapiens"
labels = ["MHC class I family", "MHC class II family", "beta-defensin family", "intercrine beta (chemokine CC) family"]
min_fraction = 0.98

[[datasets.human-fly.gates]]
type = "label_exclusive"
column = "protein_families"
by = "species"
group = "Drosophila melanogaster"
labels = ["PBP/GOBP family"]
min_fraction = 0.98

[[datasets.human-fly.gates]]
type = "neighbourhood"   # the paper: 1.000 human neighbours
name = "human-only regions"
projection = "ProtT5 — UMAP 2"
column = "species"
value = "Homo sapiens"
subset_column = "protein_families"
subset_labels = ["MHC class I family", "MHC class II family", "intercrine beta (chemokine CC) family"]
k = 50
min_mean = 0.9

[[datasets.human-fly.gates]]
type = "neighbourhood"   # the paper: 0.000 human neighbours
name = "fly-only regions"
projection = "ProtT5 — UMAP 2"
column = "species"
value = "Drosophila melanogaster"
subset_column = "protein_families"
subset_labels = ["PBP/GOBP family"]
k = 50
min_mean = 0.9

